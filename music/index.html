<!--
Single-file Music Player (music-player.html)
Usage:
1. Place this file in a folder on your web server (or open locally in modern browsers).
2. Create a subfolder named `tracks/` and put your .m4a files there (or change the paths below).
3. Edit the `tracks` array in the <script> section to include your files and titles.

Features:
- Play/pause, prev/next with Bootstrap Icons
- Clickable progress bar and time display
- Volume control
- Download link for each track (uses the `download` attribute)
- Responsive layout
-->

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Short tunes for games by Beth</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root{--bg:#0f1724;--card:#0b1220;--accent:#7dd3fc;--muted:#94a3b8}
    body{font-family:Inter,system-ui,Segoe UI,Roboto,Helvetica,Arial;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:linear-gradient(180deg,#071029 0,#07172a 100%);color:#e6eef8}
    .wrap{width:min(980px,94%);max-width:980px}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
    h1{font-size:20px;margin:0}
    .player{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border-radius:12px;padding:18px;box-shadow:0 6px 18px rgba(2,6,23,0.6)}
    .now{display:flex;gap:16px;align-items:center}
    .cover{width:96px;height:96px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#60a5fa);display:flex;align-items:center;justify-content:center;font-weight:700;color:#042028}
    .meta{flex:1}
    .title{font-size:16px;margin:0 0 6px 0}
    .artist{color:var(--muted);margin:0;font-size:13px}
    .controls{display:flex;gap:12px;align-items:center;margin-top:12px}
    .btn{background:transparent;border:0;color:inherit;padding:8px;border-radius:10px;cursor:pointer;font-size:15px}
    .big{font-size:20px;padding:10px}
    .progress{width:100%;height:8px;background:rgba(255,255,255,0.06);border-radius:8px;cursor:pointer;position:relative;overflow:hidden}
    .progress > i{position:absolute;left:0;top:0;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#60a5fa);border-radius:8px}
    .times{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:8px}
    .playlist{margin-top:16px;border-top:1px solid rgba(255,255,255,0.03);padding-top:12px;max-height:360px;overflow:auto}
    .track{display:flex;align-items:center;justify-content:space-between;padding:10px;border-radius:8px;gap:10px}
    .track:hover{background:rgba(255,255,255,0.02)}
    .track .left{display:flex;gap:12px;align-items:center}
    .track .num{width:34px; text-align:center;color:var(--muted)}
    .track .name{font-size:14px}
    .track .actions{display:flex;gap:8px;align-items:center}
    .download{font-size:13px;text-decoration:none;color:var(--muted);border:1px solid rgba(255,255,255,0.02);padding:6px 8px;border-radius:8px}
    footer{margin-top:14px;color:var(--muted);font-size:13px;text-align:center}
    @media (max-width:640px){.now{flex-direction:column;align-items:stretch}.cover{width:80px;height:80px;margin:0 auto}}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Simple Music Player</h1>
      <div style="font-size:13px;color:var(--muted)">Play & download</div>
    </header>

    <section class="player" role="region" aria-label="Music player">
      <div class="now">
        <div class="cover" id="cover">♪</div>
        <div class="meta">
          <p class="title" id="trackTitle">No track selected</p>
          <p class="artist" id="trackArtist">—</p>

          <div class="controls">
            <button class="btn" id="prevBtn" title="Previous"><i class="bi bi-skip-backward-fill"></i></button>
            <button class="btn big" id="playBtn" title="Play/Pause"><i class="bi bi-play-fill"></i></button>
            <button class="btn" id="nextBtn" title="Next"><i class="bi bi-skip-forward-fill"></i></button>

            <div style="flex:1"></div>

            <label style="display:flex;align-items:center;gap:8px">
              <input type="range" id="volume" min="0" max="1" step="0.01" value="1" style="width:110px">
              <span style="font-size:13px;color:var(--muted)">Volume</span>
            </label>
          </div>

          <div style="margin-top:12px">
            <div class="progress" id="progress">
              <i></i>
            </div>
            <div class="times"><span id="curTime">0:00</span><span id="durTime">0:00</span></div>
          </div>
        </div>
      </div>

      <div class="playlist" id="playlist" aria-live="polite">
        <!-- Tracks are injected here -->
      </div>

      <audio id="audio" preload="metadata"></audio>

    </section>

    <footer>Some tunes created by Beth for students to use in their game projects. Let us know if you like it! hello@chillpod.studio</footer>
  </div>

  <script>
    const tracks = [
      { title: 'Track 1', artist: 'Beth', src: 'tracks/GAME_MUSIC_1.wav' },
      { title: 'Track 2', artist: 'Beth', src: 'tracks/GAME_MUSIC_2.wav' },
      { title: 'Track 3', artist: 'Beth', src: 'tracks/GAME_MUSIC_3.wav' },
      { title: 'Track 4', artist: 'Beth', src: 'tracks/GAME_MUSIC_4.wav' },

    ];

    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const trackTitle = document.getElementById('trackTitle');
    const trackArtist = document.getElementById('trackArtist');
    const playlistEl = document.getElementById('playlist');
    const progress = document.getElementById('progress');
    const progressBar = progress.querySelector('i');
    const curTime = document.getElementById('curTime');
    const durTime = document.getElementById('durTime');
    const volume = document.getElementById('volume');
    const cover = document.getElementById('cover');

    let current = 0;
    let isPlaying = false;

    function renderPlaylist(){
      playlistEl.innerHTML = '';
      tracks.forEach((t, i) => {
        const tr = document.createElement('div');
        tr.className = 'track';
        tr.innerHTML = `
          <div class="left">
            <div class="num">${i+1}</div>
            <div>
              <div class="name">${t.title}</div>
              <div style="font-size:12px;color:var(--muted)">${t.artist || ''}</div>
            </div>
          </div>
          <div class="actions">
            <button class="btn" data-action="play" data-index="${i}"><i class="bi bi-play-fill"></i></button>
            <a class="download" href="${t.src}" download><i class="bi bi-download"></i></a>
          </div>`;
        playlistEl.appendChild(tr);
      });
    }

    function loadTrack(index){
      if(!tracks[index]) return;
      current = index;
      const t = tracks[index];
      audio.src = t.src;
      audio.load();
      trackTitle.textContent = t.title;
      trackArtist.textContent = t.artist || '';
      cover.textContent = t.title.split(' ').slice(0,2).map(s=>s[0]||'').join('') || '♪';
      highlightCurrent();
    }

    function highlightCurrent(){
      const buttons = playlistEl.querySelectorAll('button[data-action="play"] i');
      buttons.forEach(icon => icon.className = 'bi bi-play-fill');
      const curBtn = playlistEl.querySelector(`button[data-index='${current}'] i`);
      if(curBtn) curBtn.className = isPlaying ? 'bi bi-pause-fill' : 'bi bi-play-fill';
    }

    function togglePlay(){
      if(!audio.src) { loadTrack(0); }
      if(audio.paused){ audio.play(); } else { audio.pause(); }
    }

    playBtn.addEventListener('click', ()=>{
      togglePlay();
    });

    prevBtn.addEventListener('click', ()=>{
      current = (current - 1 + tracks.length) % tracks.length;
      loadTrack(current);
      audio.play();
    });

    nextBtn.addEventListener('click', ()=>{
      current = (current + 1) % tracks.length;
      loadTrack(current);
      audio.play();
    });

    playlistEl.addEventListener('click', (e)=>{
      const btn = e.target.closest('button[data-action]');
      if(!btn) return;
      const idx = Number(btn.dataset.index);
      if(idx === current){
        togglePlay();
      } else {
        loadTrack(idx);
        audio.play();
      }
    });

    audio.addEventListener('play', ()=>{ isPlaying = true; playBtn.innerHTML = '<i class="bi bi-pause-fill"></i>'; highlightCurrent(); });
    audio.addEventListener('pause', ()=>{ isPlaying = false; playBtn.innerHTML = '<i class="bi bi-play-fill"></i>'; highlightCurrent(); });

    audio.addEventListener('timeupdate', ()=>{
      if(audio.duration){
        const pct = (audio.currentTime / audio.duration) * 100;
        progressBar.style.width = pct + '%';
        curTime.textContent = formatTime(audio.currentTime);
      }
    });

    audio.addEventListener('loadedmetadata', ()=>{
      durTime.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('ended', ()=>{
      current = (current + 1) % tracks.length;
      loadTrack(current);
      audio.play();
    });

    progress.addEventListener('click', (e)=>{
      if(!audio.duration) return;
      const rect = progress.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const pct = x / rect.width;
      audio.currentTime = pct * audio.duration;
    });

    volume.addEventListener('input', ()=>{ audio.volume = Number(volume.value); });

    function formatTime(s){
      if(!s || isNaN(s)) return '0:00';
      const m = Math.floor(s/60);
      const sec = Math.floor(s%60).toString().padStart(2,'0');
      return `${m}:${sec}`;
    }

    renderPlaylist();
    if(tracks.length>0){ loadTrack(0); }
  </script>
</body>
</html>
